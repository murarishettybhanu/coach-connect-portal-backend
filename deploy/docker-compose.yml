# Runs on the GCP VM at /opt/shipkit/docker-compose.yml
# Pulls prebuilt images from GHCR (pushed by GitHub Actions) and fronts them with Caddy.
services:
  backend:
    image: ghcr.io/murarishettybhanu/coach-connect-portal-backend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://coach-connect-portal.onrender.com,https://tribemerchandise.com,https://www.tribemerchandise.com,https://tribemerchandise.in,https://www.tribemerchandise.in}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://tribemerchandise.com}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      # Keep Node heap under the container mem_limit to avoid OOM on the 1GB box.
      NODE_OPTIONS: "--max-old-space-size=320"
    mem_limit: 400m
    expose:
      - "3000"

  # Frontend moved to Render (served on the apex/www domains). This box runs
  # backend + caddy only. To roll back: point apex DNS back to this IP and
  # re-add a frontend service + apex handle to the Caddyfile.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" for IP-only access. Set to your domain (e.g. shipkit.example.com)
      # to get automatic HTTPS from Caddy.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # No depends_on: backend & frontend deploy independently (each CI job only
    # has access to its own GHCR image). Caddy proxies whichever is up.

volumes:
  caddy_data:
  caddy_config:
