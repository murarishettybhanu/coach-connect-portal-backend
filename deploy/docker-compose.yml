# Runs on the GCP VM at /opt/shipkit/docker-compose.yml
# Pulls prebuilt images from GHCR (pushed by GitHub Actions) and fronts them with Caddy.
services:
  backend:
    image: ghcr.io/murarishettybhanu/coach-connect-portal-backend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://tribemerchandise.com,https://www.tribemerchandise.com,https://tribemerchandise.in,https://www.tribemerchandise.in}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://tribemerchandise.com}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      WHATSAPP_OTP_TEMPLATE_ID: ${WHATSAPP_OTP_TEMPLATE_ID:-1521285713364906}
      WHATSAPP_DISPATCH_TEMPLATE_ID: ${WHATSAPP_DISPATCH_TEMPLATE_ID:-1057815553754091}
      WHATSAPP_DELIVERED_TEMPLATE_ID: ${WHATSAPP_DELIVERED_TEMPLATE_ID:-1419053503494614}
      WHATSAPP_RETURNED_TEMPLATE_ID: ${WHATSAPP_RETURNED_TEMPLATE_ID:-1590261155917388}
      # Nightly 9pm IST dispatch digest to tribe owners. Sending is OFF unless
      # one of these is set: TEST_NUMBER routes every digest to a single number,
      # ENABLED=true sends to the real owners. Neither = compute and log only.
      WHATSAPP_DIGEST_TEST_NUMBER: ${WHATSAPP_DIGEST_TEST_NUMBER:-}
      WHATSAPP_DIGEST_ENABLED: ${WHATSAPP_DIGEST_ENABLED:-}
      WHATSAPP_DIGEST_TEMPLATE_ID: ${WHATSAPP_DIGEST_TEMPLATE_ID:-1393420296257983}
      # Friday 6pm IST weekly fulfilment report; same on/off switches as above.
      WHATSAPP_WEEKLY_TEMPLATE_ID: ${WHATSAPP_WEEKLY_TEMPLATE_ID:-1638054397686424}
      # India Post external-integration API (consignment tracking). Defaults to
      # the UAT host; switch to the production host once India Post issues
      # production credentials and whitelists this VM's IP.
      INDIAPOST_BASE_URL: ${INDIAPOST_BASE_URL:-https://test.cept.gov.in/beextcustomer}
      INDIAPOST_USERNAME: ${INDIAPOST_USERNAME:-}
      INDIAPOST_PASSWORD: ${INDIAPOST_PASSWORD:-}
      # Keep Node heap under the container mem_limit to avoid OOM on the 1GB box.
      NODE_OPTIONS: "--max-old-space-size=320"
    mem_limit: 400m
    expose:
      - "3000"

  # Frontend is a STATIC SPA served by caddy from ./frontend (mounted read-only
  # at /srv/frontend). The coach-connect-portal repo's CI builds the static bundle
  # and rsyncs it into /opt/shipkit/frontend. No frontend Node container runs here.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" for IP-only access. Set to your domain (e.g. shipkit.example.com)
      # to get automatic HTTPS from Caddy.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
