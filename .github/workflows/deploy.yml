name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Immutable SHA tag (for rollback/audit) + moving :latest.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      # Version-deploy the infra config (compose + Caddyfile) to the VM so
      # changes here actually take effect, not just the container images.
      - name: Sync infra config to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "/opt/shipkit/"
          strip_components: 1

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/shipkit
            # Write runtime env from GitHub secrets
            cat > .env <<'EOF'
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SITE_ADDRESS=${{ secrets.SITE_ADDRESS }}
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_SECURE=${{ secrets.MAIL_SECURE }}
            MAIL_USER=${{ secrets.MAIL_USER }}
            MAIL_PASS=${{ secrets.MAIL_PASS }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
            S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
            S3_PUBLIC_BASE_URL=${{ secrets.S3_PUBLIC_BASE_URL }}
            EOF
            chmod 600 .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Remember the currently-running image so we can roll back if the new one is unhealthy.
            PREV_IMG=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q backend)" 2>/dev/null || echo "")
            docker compose pull backend
            docker compose up -d backend caddy
            # Pick up any Caddyfile changes (graceful, no downtime).
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || true
            # Health gate: wait for the backend container's HEALTHCHECK to pass.
            HEALTHY=0
            for i in $(seq 1 24); do
              ST=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q backend)" 2>/dev/null || echo "")
              if [ "$ST" = "healthy" ] || [ -z "$ST" ]; then HEALTHY=1; break; fi
              sleep 5
            done
            if [ "$HEALTHY" != "1" ]; then
              echo "Backend did not become healthy — rolling back to previous image."
              if [ -n "$PREV_IMG" ]; then
                docker tag "$PREV_IMG" ghcr.io/${{ github.repository }}:latest
                docker compose up -d backend
              fi
              docker logout ghcr.io || true
              exit 1
            fi
            docker logout ghcr.io || true
